# Fork-only check of the mod folders' lookup (src/game/modfs.c) on each host
# family: the unit test (tests/modfs) on Linux, macOS (its usual case-folding
# volume and a case-sensitive one) and Windows, sanitizer runs on Linux, and an
# Android NDK build for the APK's target. No game data, no secrets, nothing
# uploaded. It runs only when started by hand or on a push to ci/modfs-xplat,
# and never in the upstream repository.
name: modfs cross-platform

on:
  workflow_dispatch:
  push:
    branches: [ci/modfs-xplat]

permissions:
  contents: read

concurrency:
  group: modfs-xplat-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolkit of Takedawn 0.2.1 (tag takedawn-0.2.1); only its headers are used.
  XBOXRECOMP_REF: e3756d1b2fefdae6888038384c748cbdd37a41ba

jobs:
  unit:
    if: github.repository != 'xenophobentx/takedawn'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: toolkit headers (xboxrecomp at the pinned commit, kernel and platform only)
        run: |
          git init -q xboxrecomp
          git -C xboxrecomp sparse-checkout set src/kernel src/platform
          git -C xboxrecomp fetch -q --depth 1 --filter=blob:none https://github.com/xenophobentx/xboxrecomp.git "$XBOXRECOMP_REF"
          git -C xboxrecomp checkout -q FETCH_HEAD
      - name: build tests/modfs (warnings are errors in modfs.c and the test)
        run: |
          if [ "$RUNNER_OS" = Windows ]; then CC=gcc; LIBS=; else CC=cc; LIBS=-pthread; fi
          "$CC" --version | head -1
          "$CC" -std=gnu11 -O2 -Wall -Wextra -Werror -isystem xboxrecomp/src -isystem xboxrecomp/src/kernel \
              tests/modfs/test_main.c src/game/modfs.c $LIBS -o modfs_test
      - name: run tests/modfs
        run: ./modfs_test
      - name: run tests/modfs on a case-sensitive volume (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -quiet -size 32m -fs "Case-sensitive APFS" -volname modfs-cs "$RUNNER_TEMP/cs.dmg"
          mkdir -p "$RUNNER_TEMP/cs"
          hdiutil attach -quiet -nobrowse -mountpoint "$RUNNER_TEMP/cs" "$RUNNER_TEMP/cs.dmg"
          TMPDIR="$RUNNER_TEMP/cs" ./modfs_test
          hdiutil detach -quiet "$RUNNER_TEMP/cs"
      - name: address, undefined-behaviour and thread sanitizers (Linux)
        if: runner.os == 'Linux'
        run: |
          for s in address,undefined thread; do
            clang -std=gnu11 -O1 -g -fno-omit-frame-pointer -fsanitize=$s -fno-sanitize-recover=all \
                -isystem xboxrecomp/src -isystem xboxrecomp/src/kernel \
                tests/modfs/test_main.c src/game/modfs.c -pthread -o modfs_test_san
            ./modfs_test_san
          done

  android-ndk:
    if: github.repository != 'xenophobentx/takedawn'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: toolkit headers (xboxrecomp at the pinned commit, kernel and platform only)
        run: |
          git init -q xboxrecomp
          git -C xboxrecomp sparse-checkout set src/kernel src/platform
          git -C xboxrecomp fetch -q --depth 1 --filter=blob:none https://github.com/xenophobentx/xboxrecomp.git "$XBOXRECOMP_REF"
          git -C xboxrecomp checkout -q FETCH_HEAD
      - name: compile and link for arm64 Android 13 (API 33, the APK's minSdk); not run
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          [ -d "$NDK" ] || { echo "no NDK on this runner image"; exit 1; }
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          "$CC" --version | head -1
          for f in src/game/modfs.c tests/modfs/test_main.c; do
            "$CC" -std=gnu11 -O2 -Wall -Wextra -Werror -isystem xboxrecomp/src -isystem xboxrecomp/src/kernel \
                -c "$f" -o "$(basename "$f").o"
          done
          # Linking against bionic at API 33 shows every call the lookup makes is there.
          "$CC" modfs.c.o test_main.c.o -o modfs_test_android
          file modfs_test_android
